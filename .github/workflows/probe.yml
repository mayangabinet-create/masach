name: probe chains
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run static probe
        run: node scripts/probe-chains.js
      - name: explore planet cinema list in page js
        run: |
          node -e '
          const UA = "Mozilla/5.0 (compatible; masach-showtimes/1.0)";
          async function get(u) {
            const r = await fetch(u, { headers: { "user-agent": UA, "accept-language": "he-IL,he;q=0.9" } });
            return { status: r.status, text: await r.text() };
          }
          (async () => {
            const { status, text } = await get("https://www.planetcinema.co.il/whatson");
            console.log(`status=${status} len=${text.length}`);
            // same pattern that revealed HOT'"'"'s branch array
            const arr = text.match(/(?:cinemas?|sites?|theaters?)\s*[:=]\s*\[[\s\S]{0,3000}?\]/i);
            console.log("\n-- possible cinemas array --");
            console.log(arr ? arr[0].slice(0, 3000) : "(none found)");
            // dropdown/select elements
            const selects = [...text.matchAll(/<select[^>]*>[\s\S]*?<\/select>/gi)];
            console.log("\nselects found:", selects.length);
            selects.slice(0, 5).forEach((m, i) => console.log(`select #${i}:`, m[0].slice(0, 300).replace(/\s+/g, " ")));
            // any data- attributes or JSON blobs with "cinema" in them
            const dataHits = [...text.matchAll(/"cinemaId"\s*:\s*"?(\w+)"?/gi)].map(m => m[1]);
            console.log("\ncinemaId hits:", [...new Set(dataHits)].slice(0, 20));
          })();
          '
      - name: install playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: run network probe
        run: node scripts/probe-network.mjs
      - name: commit report
        run: |
          git config user.name masach-bot
          git config user.email actions@github.com
          git add -A data
          git diff --staged --quiet || git commit -m "probe report"
          git push
