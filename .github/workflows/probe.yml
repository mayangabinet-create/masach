name: probe chains
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run static probe
        run: node scripts/probe-chains.js
      - name: install playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: run network probe
        run: node scripts/probe-network.mjs
      - name: explore ravhen api shape
        run: |
          node -e '
          const UA = "Mozilla/5.0 (compatible; masach-showtimes/1.0)";
          const urls = [
            "https://www.rav-hen.co.il/rh/data-api-service/v1/quickbook/10104/film-events/in-cinema/1058/at-date/2026-08-08?attr=&lang=he_IL",
            "https://www.rav-hen.co.il/rh/data-api-service/v1/quickbook/10104/cinemas/with-event/until/2027-08-08?attr=&lang=he_IL",
            "https://www.planetcinema.co.il/xmedia/js/config.js",
          ];
          (async () => {
            for (const u of urls) {
              try {
                const r = await fetch(u, { headers: { "user-agent": UA, accept: "application/json,*/*" } });
                const t = await r.text();
                console.log("\n=== " + u + "  [" + r.status + "]  len=" + t.length);
                console.log(t.slice(0, 6000));
              } catch (e) { console.log("ERR " + u + " " + e.message); }
            }
          })();
          '
      - name: commit report
        run: |
          git config user.name masach-bot
          git config user.email actions@github.com
          git add -A data
          git diff --staged --quiet || git commit -m "probe report"
          git push
