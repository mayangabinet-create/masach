name: probe chains
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run static probe
        run: node scripts/probe-chains.js
      - name: explore planet cinema links
        run: |
          node -e '
          const UA = "Mozilla/5.0 (compatible; masach-showtimes/1.0)";
          async function get(u) {
            const r = await fetch(u, { headers: { "user-agent": UA, "accept-language": "he-IL,he;q=0.9" } });
            return { status: r.status, text: await r.text() };
          }
          (async () => {
            for (const u of ["https://www.planetcinema.co.il/", "https://www.planetcinema.co.il/cinemas", "https://www.planetcinema.co.il/whatson"]) {
              const { status, text } = await get(u);
              console.log(`\n=== ${u} [${status}] len=${text.length}`);
              const hrefs = [...text.matchAll(/href="([^"]*\/cinemas?\/[^"]*)"/gi)].map(m => m[1]);
              console.log("cinema-ish links:", [...new Set(hrefs)].slice(0, 30));
            }
          })();
          '
      - name: install playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: run network probe
        run: node scripts/probe-network.mjs
      - name: commit report
        run: |
          git config user.name masach-bot
          git config user.email actions@github.com
          git add -A data
          git diff --staged --quiet || git commit -m "probe report"
          git push
