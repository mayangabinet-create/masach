name: probe chains
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run static probe
        run: node scripts/probe-chains.js
      - name: explore hot theaters
        run: |
          node -e '
          const UA = "Mozilla/5.0 (compatible; masach-showtimes/1.0)";
          const today = new Date();
          const dd = String(today.getDate()).padStart(2,"0") + "/" + String(today.getMonth()+1).padStart(2,"0") + "/" + today.getFullYear();
          async function get(u) {
            const r = await fetch(u, { headers: { "user-agent": UA, accept: "application/json,text/html,*/*" } });
            return { status: r.status, text: await r.text() };
          }
          (async () => {
            // 1. full TheaterEvents2 shape for theatreid=1
            const ev = await get(`https://hotcinema.co.il/tickets/TheaterEvents2?movieid=undefined&date=${dd}&theatreid=1&site=undefined&time=&type=undefined&lang=&kinorai=undefined&genreId=0&screentype=&subdub=&isnew=false`);
            console.log("=== TheaterEvents2 theatreid=1 [" + ev.status + "] len=" + ev.text.length);
            console.log(ev.text.slice(0, 5000));

            // 2. probe theatreid 1..15 for which exist / have events, and grab titles
            for (let id = 1; id <= 15; id++) {
              try {
                const [page, events] = await Promise.all([
                  get(`https://hotcinema.co.il/theater/${id}`),
                  get(`https://hotcinema.co.il/tickets/TheaterEvents2?movieid=undefined&date=${dd}&theatreid=${id}&site=undefined&time=&type=undefined&lang=&kinorai=undefined&genreId=0&screentype=&subdub=&isnew=false`),
                ]);
                const title = (page.text.match(/<title>([\s\S]*?)<\/title>/i) || [,"?"])[1].trim();
                let evCount = 0;
                try { evCount = (JSON.parse(events.text).TheaterEvents || []).length; } catch {}
                console.log(`theatreid=${id}  page=${page.status} title="${title}"  events=${events.status}/${evCount}`);
              } catch (e) { console.log(`theatreid=${id} ERR ${e.message}`); }
            }
          })();
          '
      - name: install playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: run network probe
        run: node scripts/probe-network.mjs
      - name: commit report
        run: |
          git config user.name masach-bot
          git config user.email actions@github.com
          git add -A data
          git diff --staged --quiet || git commit -m "probe report"
          git push
