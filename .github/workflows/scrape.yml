name: masach scrape
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/scrape.mjs
        env:
          DEBUG: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
      - name: scrape רב חן
        run: node scripts/scrape-ravhen.mjs
        continue-on-error: true # אם רב חן נופל, לא רוצים לעצור את עדכון סינמה סיטי
      - name: scrape HOT
        run: node scripts/scrape-hot.mjs
        continue-on-error: true
      - run: |
          git config user.name masach-bot
          git config user.email actions@github.com
          git add -A data
          git diff --staged --quiet || git commit -m "showtimes update"
          git push
