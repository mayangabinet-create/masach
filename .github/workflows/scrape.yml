name: masach scrape

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 9 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Save result
        run: |
          git config user.name  "masach-bot"
          git config user.email "actions@github.com"
          git add data/showtimes.json data/movies.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "showtimes update $(date -u '+%Y-%m-%d %H:%M')"
          git push
